<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Get Solar Quote | Tuknova Enterprise</title>
    <link rel="stylesheet" href="shared.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
</head>
<body>
    <!-- Paste Nav Here -->

    <section class="form-container">
        <h1 style="font-family:var(--font-display); color:var(--solar); margin-bottom:10px;">☀️ Full Solar System Quote</h1>
        <p style="color:var(--muted); margin-bottom:30px;">Tell us about your home/office, and we'll send a custom quote to your WhatsApp.</p>
        
        <form id="solarForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Location (State/City)</label>
                <input type="text" id="location" placeholder="e.g. Ikeja, Lagos" required>
            </div>
            <div class="form-group">
                <label>What do you want to power?</label>
                <textarea id="load" rows="3" placeholder="e.g. 2 ACs, 1 Fridge, 10 Bulbs..."></textarea>
            </div>
            <button type="submit" class="btn-primary" style="width:100%; border:none; cursor:pointer; padding:15px; background:var(--solar); color:black; font-weight:800; border-radius:10px;">SEND TO WHATSAPP</button>
        </form>
    </section>

    <script src="shared.js"></script>
    <script>
        document.getElementById('solarForm').onsubmit = function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const loc = document.getElementById('location').value;
            const load = document.getElementById('load').value;
            const text = `Hello Tuknova! I want a Solar Quote.%0A*Name:* ${name}%0A*Location:* ${loc}%0A*Load:* ${load}`;
            window.location.href = `https://wa.me/2349064859498?text=${text}`;
        }
    </script>
</body>
</html>
